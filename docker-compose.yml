version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: seo-platform-db
    environment:
      - POSTGRES_DB=seo_platform
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seo-platform-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
